<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
    <style>
      /* Crítico: primer paint antes del bundle (evita pantalla en blanco) */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
      }
      #root {
        min-height: 100vh;
        background: #000;
      }
      #app-boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: block;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app-boot-shell .app-boot-splash {
        position: absolute;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    </style>
    <!-- TV_PLATFORM_ENV -->
    <script src="%BASE_URL%tv-platform-bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-shell" role="status" aria-live="polite" aria-busy="true">
        <img id="app-boot-splash" class="app-boot-splash" alt="Cargando…" />
      </div>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search || '');
          var brand = params.get('brand') || window.localStorage.getItem('brand') || 'bromteck';

          // Si viene por URL, persistimos para próximos arranques.
          if (params.get('brand')) {
            try { window.localStorage.setItem('brand', brand); } catch (e) {}
          }

          var img = document.getElementById('app-boot-splash');
          if (!img) return;

          var triedFallback = false;
          img.onerror = function () {
            if (!triedFallback) {
              triedFallback = true;
              img.src = '/shared/splash.png';
              return;
            }
            // Si también falla el fallback, ocultar para evitar ícono de imagen rota.
            img.style.display = 'none';
          };

          img.src = '/' + String(brand).replace(/^\/+/, '') + '/splash.png';
        } catch (e) {
          // Si algo falla, dejamos el fondo negro (sin bloquear el arranque)
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
