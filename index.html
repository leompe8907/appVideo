<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app</title>
    <style>
      /* Crítico: primer paint antes del bundle (evita pantalla en blanco) */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
      }
      #root {
        min-height: 100vh;
        background: #000;
      }
      #app-boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app-boot-shell .app-boot-spinner {
        width: 50px;
        height: 50px;
        box-sizing: border-box;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: app-boot-spin 1s linear infinite;
      }
      #app-boot-shell .app-boot-label {
        margin: 0;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.85);
      }
      @keyframes app-boot-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-shell" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p class="app-boot-label">Cargando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
